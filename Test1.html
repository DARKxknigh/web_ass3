<!DOCTYPE html>
<html>
<head>
<title>Test1</title>
<style>
body {
    margin: 0;
    font-family: Arial;
    text-align: center;
}

#header {
    background-color: #eeeeee;
    padding: 20px;
    font-size: 22px;
}

#boxes {
    margin-top: 90px;
}

.box {
    display: inline-block;
    width: 88px;
    height: 88px;
    line-height: 88px;
    margin: 0 15px;
    border: 1px solid lightgray;
    cursor: pointer;
}

#greetArea {
    margin-top: 110px;
}

input {
    padding: 8px;
    width: 160px;
}

button {
    padding: 8px 14px;
}
</style>
</head>

<body>

<div id="header">Hello</div>

<div id="boxes">
    <div class="box" id="box1">Red</div>
    <div class="box" id="box2">Blue</div>
    <div class="box" id="box3">Green</div>
    <div class="box" id="box4">Yellow</div>
</div>

<div id="greetArea">
    <input type="text" id="name">
    <button id="greetBtn">Greet</button>
</div>

<script>
// greeting part
var btn = document.getElementById("greetBtn");

btn.onclick = function () {
    var name = document.getElementById("name").value;
    document.getElementById("header").innerHTML = "Hello, " + name;
};

// color boxes
var box1 = document.getElementById("box1");
var box2 = document.getElementById("box2");
var box3 = document.getElementById("box3");
var box4 = document.getElementById("box4");

box1.onclick = function () {
    box1.style.backgroundColor = "red";
    box1.style.color = "white";
};

box2.onclick = function () {
    box2.style.backgroundColor = "blue";
    box2.style.color = "white";
};

box3.onclick = function () {
    box3.style.backgroundColor = "green";
    box3.style.color = "white";
};

box4.onclick = function () {
    box4.style.backgroundColor = "yellow";
};
</script>

</body>
</html>
